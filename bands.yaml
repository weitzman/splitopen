# Who plays which stem for each band. A song in songs.yaml names its band by
# the key here; see README.md for the fields.
phish:
  name: Phish
  channels:
    guitar: {who: Trey, inst: Guitar}
    bass: {who: Mike, inst: Bass}
    keys: {who: Page, inst: Keys}
    drums: {who: Fish, inst: Drums}
    vocals: {who: Vocals, inst: Larynx}

widespread-panic:
  name: Widespread Panic
  channels:
    guitar: {who: JB & Mikey, inst: Guitars}
    bass: {who: Schools, inst: Bass}
    keys: {who: JoJo, inst: Keys}
    drums: {who: Todd & Sunny, inst: Drums & Perc}
    vocals: {who: Vocals, inst: Larynx}

goose:
  name: Goose
  channels:
    guitar: {who: Rick, inst: Guitar}
    bass: {who: Trevor, inst: Bass}
    keys: {who: Peter, inst: Keys}
    drums: {who: Cotter, inst: Drums}
    vocals: {who: Vocals, inst: Larynx}

# A string band has no keys or drums, so neither is listed and the player
# leaves them out. BS-Roformer-SW puts guitar, banjo and mandolin together
# in the guitar stem, so that channel is the whole band.
billy-strings:
  name: Billy Strings
  channels:
    guitar: {who: Billy & the band, inst: "Guitar, Banjo & Mando"}
    bass: {who: Royal, inst: Bass}
    vocals: {who: Vocals, inst: Larynx}

# The December 2015 lineup: Tyler and J.J. on two drum kits and a three-piece
# horn section. BS-Roformer-SW puts every wind instrument into one stem, which
# is the horns channel; when Kofi Burbridge plays flute in a song, that song
# adds `flute: {who: Kofi, inst: Flute}` after scripts/wind-stems.py splits
# it out of the same stem.
tedeschi-trucks-band:
  name: Tedeschi Trucks Band
  channels:
    guitar: {who: Derek & Susan, inst: Guitars}
    bass: {who: Tim, inst: Bass}
    keys: {who: Kofi, inst: Keys}
    drums: {who: Tyler & JJ, inst: Drums}
    vocals: {who: Vocals, inst: Larynx}
    horns: {who: Horns, inst: "Sax, Trumpet & Bone"}
