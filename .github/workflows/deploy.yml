# Publishes main to the gh-pages branch, which GitHub Pages serves.
# pr-preview/ is left alone so open PR previews (see preview.yml) survive.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-site

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML and jsonschema, which the scripts check the data files with
        run: python3 -c 'import yaml, jsonschema, referencing' 2>/dev/null || python3 -m pip install pyyaml 'jsonschema>=4.18'

      - name: Check the songs and bands
        run: python3 scripts/check-songs.py

      - name: Index the guides
        run: python3 scripts/guides-index.py

      - name: Write the song pages, which carry each song's link preview
        run: python3 scripts/song-pages.py

      - name: Render each song's preview card with the runner's Chrome
        run: python3 scripts/song-cards.py

      # The deploy commits the folder with git, which honors .gitignore, so
      # the generated s/ would be left out of the site with it in place.
      - name: Drop .gitignore so the generated pages and cards deploy
        run: rm .gitignore

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          # One commit, rewritten each deploy, so gh-pages does not accumulate
          # a full copy of the site per push.
          single-commit: true
          commit-message: Deploy ${{ github.sha }}
