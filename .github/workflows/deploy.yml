# Publishes the site (web/ at the root, audio/ beside it) to the gh-pages
# branch, which GitHub Pages serves. pr-preview/ is left alone so open PR
# previews (see preview.yml) survive.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-site

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: scripts/build-site.sh

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          commit-message: Deploy ${{ github.sha }}
