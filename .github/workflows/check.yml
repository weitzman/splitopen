# Checks songs.yaml, bands.yaml and every guide under guides/ the way the
# player reads them, so a pull request with a broken entry shows a failed
# check before it is merged. deploy.yml and preview.yml run the same
# scripts and fail the same way.
name: Check data

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML, which the scripts read the data files with
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install pyyaml

      - name: Check the songs and bands
        run: python3 scripts/check-songs.py

      - name: Parse the guides
        run: python3 scripts/guides-index.py --lint
