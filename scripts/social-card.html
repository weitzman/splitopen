<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1026;--bg-2:#141b3a;--panel:rgba(20,27,58,.85);--line:rgba(255,255,255,.08);--text:#f4efe6;--muted:#9aa0b8;--gold:#f2b134;--donut:#d7263d;--trey:#ff6b35;--mike:#3dd6a3;--page:#a66cff;--fish:#d7263d;--vox:#f2b134}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:radial-gradient(1400px 700px at 50% -10%,var(--bg-2),var(--bg) 70%);color:var(--text);font-family:Inter,sans-serif}
.backdrop{position:absolute;inset:0;opacity:.09;background:url(../bg-rings.svg) 0 0/320px 64px repeat}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:0 80px}
.head{display:flex;align-items:center;gap:28px;margin-top:-6px}
.mark{width:150px;height:94px}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:112px;line-height:1;margin:0;letter-spacing:-.03em;text-shadow:0 0 36px rgba(242,177,52,.28)}
.tag{margin:26px 0 0;font-size:30px;color:var(--muted);text-align:center;line-height:1.3;font-weight:400}
.tag b{color:var(--text);font-weight:600}
.mixer{display:grid;grid-template-columns:repeat(5,170px);gap:14px;margin-top:48px}
.strip{--c:var(--gold);background:var(--panel);border:3px solid var(--c);border-radius:14px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.who{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:29px;letter-spacing:-.02em;color:var(--c);line-height:1}
.inst{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.meter{width:100%;height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:linear-gradient(to right,var(--c),var(--gold) 80%,var(--donut))}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{font:700 13px Inter;letter-spacing:.05em;width:46px;height:30px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);display:grid;place-items:center}
.btn.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
</style></head><body>
<div class="backdrop"></div>
<div class="wrap">
  <div class="head">
    <svg class="mark" viewBox="0 0 64 40"><path d="M2 20h6l4-14 6 28 5-20 4 12 3-6h6" fill="none" stroke="#f4efe6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 20c10 0 10-16 24-16" fill="none" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/><path d="M36 20c10 0 10-8 24-8" fill="none" stroke="#3dd6a3" stroke-width="3" stroke-linecap="round"/><path d="M36 20h24" fill="none" stroke="#a66cff" stroke-width="3" stroke-linecap="round"/><path d="M36 20c10 0 10 8 24 8" fill="none" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/><path d="M36 20c10 0 10 16 24 16" fill="none" stroke="#f2b134" stroke-width="3" stroke-linecap="round"/></svg>
    <h1>Split Open</h1>
  </div>
  <p class="tag">Live recordings, one player per band member.<br><b>Mute</b>, <b>solo</b>, and mix each stem to hear how the music works.</p>
  <div class="mixer">
    <div class="strip" style="--c:#ff6b35"><div class="who">Trey</div><div class="inst">Guitar</div><div class="meter"><div class="fill" style="width:72%"></div></div><div class="btns"><div class="btn">M</div><div class="btn on">S</div></div></div>
    <div class="strip" style="--c:#3dd6a3"><div class="who">Mike</div><div class="inst">Bass</div><div class="meter"><div class="fill" style="width:58%"></div></div><div class="btns"><div class="btn">M</div><div class="btn">S</div></div></div>
    <div class="strip" style="--c:#a66cff"><div class="who">Page</div><div class="inst">Keys</div><div class="meter"><div class="fill" style="width:44%"></div></div><div class="btns"><div class="btn">M</div><div class="btn">S</div></div></div>
    <div class="strip" style="--c:#d7263d"><div class="who">Fish</div><div class="inst">Drums</div><div class="meter"><div class="fill" style="width:81%"></div></div><div class="btns"><div class="btn">M</div><div class="btn">S</div></div></div>
    <div class="strip" style="--c:#f2b134"><div class="who">Vocals</div><div class="inst">Larynx</div><div class="meter"><div class="fill" style="width:36%"></div></div><div class="btns"><div class="btn">M</div><div class="btn">S</div></div></div>
  </div>
</div>
</body></html>
