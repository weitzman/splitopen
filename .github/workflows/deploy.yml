# Publishes main to the gh-pages branch, which GitHub Pages serves.
# pr-preview/ is left alone so open PR previews (see preview.yml) survive.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-site

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML, which the scripts read the data files with
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install pyyaml

      - name: Check the songs and bands
        run: python3 scripts/check-songs.py

      - name: Index the guides
        run: python3 scripts/guides-index.py

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          commit-message: Deploy ${{ github.sha }}
